<h1>amail</h1>
<p>The server is running, but this binary was built without the web interface.</p>
<p>To include it, build the interface and then the server (Node 20 or later):</p>
<pre>cd web
npm ci
npm run build
cd ..
cargo build --release</pre>
<p>The HTTP API under <code>/v1</code> works either way.</p>
