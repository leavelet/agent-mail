name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (SQLite and Postgres)
    runs-on: ubuntu-24.04
    env:
      AMAIL_TEST_PG_URL: postgres://postgres:amail@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start Postgres
        # Each Postgres test creates its own database; allow enough
        # connections for the tests running in parallel.
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=amail -p 127.0.0.1:5432:5432 \
            postgres:17 -c max_connections=500
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -U postgres && exit 0
            sleep 1
          done
          exit 1
      - name: Git identity for the team tests
        run: |
          git config --global user.name "amail CI"
          git config --global user.email "ci@example.invalid"
      # With AMAIL_TEST_PG_URL set, every backend test runs on SQLite and on
      # Postgres.
      - run: cargo test --workspace --locked

  web:
    name: Web interface (lint, types, unit, end-to-end)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/web/.e2e/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build amail with the interface embedded
        run: cargo build --locked -p amail-cli
        working-directory: .
      - name: Git identity
        run: |
          git config --global user.name "amail CI"
          git config --global user.email "ci@example.invalid"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          AMAIL_SCREENSHOTS: ${{ github.workspace }}/web/.e2e/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots-and-traces
          path: |
            web/.e2e/screenshots
            web/.e2e/test-results
          if-no-files-found: ignore

  macos:
    name: macOS build (server and mail commands)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked -p amail-cli
      - name: Linux-only commands refuse with a clear error
        run: |
          ./target/debug/amail --version
          if ./target/debug/amail node 2> err.txt; then exit 1; fi
          grep -q "Linux only" err.txt
