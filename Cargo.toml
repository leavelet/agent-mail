[workspace]
resolver = "2"
members = [
    "crates/amail-proto",
    "crates/amail-store",
    "crates/amail-server",
    "crates/amail-node",
    "crates/amail-cli",
    "crates/amail-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
amail-proto = { path = "crates/amail-proto" }
amail-store = { path = "crates/amail-store" }
amail-server = { path = "crates/amail-server" }
amail-node = { path = "crates/amail-node" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
jiff = "0.2"
libc = "0.2"
# Markdown parsing of documents (headings, links); no HTML output.
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
# The MCP server of `amail mcp`: only the server and the stdio transport.
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Unified diffs of document revisions.
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "macros", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
